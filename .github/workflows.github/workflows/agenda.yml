name: Agenda cultural

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  revisar-agenda:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Ejecutar bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Guardar eventos
        run: |
          git config user.name "agenda-bot"
          git config user.email "agenda-bot@example.com"
          git add eventos.json
          git diff --cached --quiet || git commit -m "Actualizar eventos"
          git push
